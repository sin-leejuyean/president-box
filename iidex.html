<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대통령 업적 분류함</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: 'Malgun Gothic', sans-serif;
            background: #f1f4f8;
            color: #263445;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #17365d;
            margin-bottom: 30px;
            font-size: 28px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 22px;
            border: 1px solid #ccd5df;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            height: 160px;
            resize: vertical;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #315b91;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #234b78;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #17365d;
        }

        h2 {
            margin-top: 35px;
            padding-bottom: 10px;
            border-bottom: 2px solid #234b78;
            color: #17365d;
        }

        .result {
            margin-top: 15px;
            padding: 17px;
            background: #f5f7fa;
            border-left: 4px solid #315b91;
            border-radius: 7px;
        }

        .category {
            display: inline-block;
            padding: 5px 10px;
            margin-bottom: 10px;
            background: #dce8f5;
            color: #234b78;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .result h3 {
            margin: 5px 0 10px;
        }

        .result p {
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .empty {
            color: #888;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>대통령 업적 분류함</h1>

        <form id="achievementForm">

            <label for="category">업적 분류</label>
            <select id="category" required>
                <option value="">분류를 선택하세요</option>
                <option value="정치">정치</option>
                <option value="경제">경제</option>
                <option value="국방">국방</option>
                <option value="민생">민생</option>
                <option value="기타">기타</option>
            </select>

            <label for="title">업적 제목</label>
            <input
                type="text"
                id="title"
                placeholder="업적 제목을 입력하세요."
                required
            >

            <label for="content">업적 내용</label>
            <textarea
                id="content"
                placeholder="대통령의 업적 내용을 입력하세요."
                required
            ></textarea>

            <button type="submit">업적 제출하기</button>

        </form>

        <h2>제출된 업적 목록</h2>

        <div id="resultList">
            <p class="empty">아직 제출된 업적이 없습니다.</p>
        </div>

    </div>

    <script>
        const form = document.getElementById('achievementForm');
        const resultList = document.getElementById('resultList');

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const category = document.getElementById('category').value;
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();

            if (!category || !title || !content) {
                alert('모든 항목을 입력해 주세요.');
                return;
            }

            const emptyMessage = resultList.querySelector('.empty');

            if (emptyMessage) {
                emptyMessage.remove();
            }

            const result = document.createElement('div');
            result.className = 'result';

            const categoryLabel = document.createElement('span');
            categoryLabel.className = 'category';
            categoryLabel.textContent = category;

            const titleElement = document.createElement('h3');
            titleElement.textContent = title;

            const contentElement = document.createElement('p');
            contentElement.textContent = content;

            result.appendChild(categoryLabel);
            result.appendChild(titleElement);
            result.appendChild(contentElement);

            resultList.prepend(result);

            form.reset();

            alert('업적이 제출되었습니다.');
        });
    </script>

</body>
</html>
